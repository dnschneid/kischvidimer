name: pre-commit

on: [pull_request, push]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
    - uses: pre-commit/action@v3.0.1
      env:
        # TODO: quick-lint-js fails in CI; see the optional step below. Stop
        # skipping it once that's fixed.
        SKIP: quick-lint-js
    - uses: pre-commit/action@v3.0.1
      # TODO: make this required again once it passes in CI
      continue-on-error: true
      with:
        extra_args: quick-lint-js --all-files
